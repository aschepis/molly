# Local Molly stack. Run from this folder: docker compose up -d
# Data lives in ${MOLLY_DATA_DIR:-./data}; stop the stack and copy that folder to back up or move.
name: molly

services:
  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: molly-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-2y}
      - --web.enable-lifecycle
      # Needed by `molly export` (TSDB snapshots) and `molly prune` (delete_series).
      # Only reachable from this machine; remove it if you expose port 9090.
      - --web.enable-admin-api
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - ${MOLLY_DATA_DIR:-./data}/prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.2.0
    container_name: molly-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3030:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: system
      # Only used when the "render" profile is up (make snap-dashboards).
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ${MOLLY_DATA_DIR:-./data}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana-dashboards:ro

  # Headless Chrome for PNG dashboard renders. Off by default:
  # docker compose --profile render up -d
  renderer:
    image: grafana/grafana-image-renderer:3.12.4
    container_name: molly-renderer
    profiles: ["render"]
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "false"
      # The default cap is 3000px, which cuts off the taller dashboards.
      RENDERING_VIEWPORT_MAX_HEIGHT: "8000"
