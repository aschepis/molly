global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: molly
    honor_labels: true
    static_configs:
      - targets: ["host.docker.internal:9765"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
