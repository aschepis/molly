groups:
  - name: molly-recording
    interval: 30s
    rules:
      - record: molly:cpu_utilization:ratio
        expr: avg by (user, host) (molly_cpu_utilization_ratio)
      - record: molly:focus_seconds:rate5m
        expr: sum by (user, host, app) (rate(molly_focus_seconds_total[5m]))
      - record: molly:active_ratio:1h
        expr: avg_over_time(molly_user_active[1h])
      - record: molly:commits:increase1d
        expr: sum by (user, host) (increase(molly_git_commits_total[1d]))
      - record: molly:claude_cost_usd:increase1d
        expr: sum by (user, host) (increase(molly_claude_estimated_cost_usd_total[1d]))
      - record: molly:claude_tokens:increase1d
        expr: sum by (user, host) (increase(molly_claude_tokens_total[1d]))
      - record: molly:memory_used:ratio
        expr: >
          sum by (user, host) (molly_memory_bytes{state=~"active|wired|compressed"})
          / on (user, host) molly_memory_total_bytes

  # Flow detection. Every 5 minutes a (user, host) is classified as
  #   2 = flow     active ratio >= 0.8 and <= 1.5 app switches per minute
  #   1 = shallow  active ratio >= 0.5 but switching faster than flow
  #   0 = break    otherwise (idle, locked, asleep, or rapid switching)
  # Thresholds are deliberately simple; tune them here, not in dashboards.
  - name: molly-flow
    interval: 30s
    rules:
      - record: molly:switch_rate:5m
        expr: sum by (user, host) (rate(molly_focus_switches_total[5m])) * 60
      - record: molly:active_ratio:5m
        expr: avg by (user, host) (avg_over_time(molly_user_active[5m]))
      - record: molly:flow_state:5m
        expr: >
          (
            (molly:active_ratio:5m >= bool 0.8)
            * (molly:switch_rate:5m <= bool 1.5)
          )
          + (molly:active_ratio:5m >= bool 0.5)
      - record: molly:flow_minutes:increase1h
        expr: count_over_time((molly:flow_state:5m == 2)[1h:5m]) * 5
      - record: molly:flow_minutes:increase1d
        expr: count_over_time((molly:flow_state:5m == 2)[1d:5m]) * 5

  # Context-switch ledger. Molly has no series for "switched and came back
  # within two minutes", so interruptions are approximated as app switches per
  # hour above a baseline of 10 that any working hour contains.
  - name: molly-ledger
    interval: 30s
    rules:
      - record: molly:interruptions:increase1h
        expr: clamp_min(sum by (user, host) (increase(molly_focus_switches_total[1h])) - 10, 0)

  - name: molly-agent-roi
    interval: 60s
    rules:
      - record: molly:claude_cost_per_commit:1d
        expr: >
          sum by (user, host) (increase(molly_claude_estimated_cost_usd_total[1d]))
          / clamp_min(sum by (user, host) (increase(molly_git_commits_total{author="me"}[1d])), 1)
      - record: molly:claude_tokens_per_commit:1d
        expr: >
          sum by (user, host) (increase(molly_claude_tokens_total[1d]))
          / clamp_min(sum by (user, host) (increase(molly_git_commits_total{author="me"}[1d])), 1)
      - record: molly:claude_tool_calls:rate1h
        expr: sum by (user, host) (increase(molly_claude_tool_calls_total[1h]))

  - name: molly-day-shape
    interval: 60s
    rules:
      - record: molly:active_hours:1d
        expr: sum by (user, host) (increase(molly_active_seconds_total[1d])) / 3600
      - record: molly:meeting_hours:1d
        expr: sum by (user, host) (increase(molly_meeting_seconds_total[1d])) / 3600
      - record: molly:focus_top_app_seconds:1d
        expr: topk(5, sum by (user, host, app) (increase(molly_focus_seconds_total[1d])))

  # Body: derived from the Apple Health numbers an iPhone Shortcut posts
  # (collectors.health). Empty until that collector is on.
  - name: molly-body
    interval: 60s
    rules:
      - record: molly:health_sleep_minutes:last_night
        expr: max by (user, host) (molly_health_sleep_minutes_last_night)
      # Molly cannot see steps by the minute, so "longest sedentary stretch" is
      # approximated by its opposite: hours in the last day that had no 5 minute
      # idle gap, to set against stand hours.
      - record: molly:active_unbroken_hours:1d
        expr: sum by (user, host) (count_over_time((min_over_time(molly_user_active[1h]) == 1)[1d:1h]))

  - name: molly-alerts
    rules:
      - alert: MollyDown
        expr: up{job="molly"} == 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: Molly is not being scraped
          description: Prometheus cannot reach Molly. Is the menu bar app running? Try `molly status`.

      - alert: LongSessionNoBreak
        # molly_user_active already drops to 0 after the 5 minute idle threshold, so a
        # 2h minimum of 1 means no break. The count guard avoids firing on sparse data.
        expr: min_over_time(molly_user_active[2h]) == 1 and count_over_time(molly_user_active[2h]) > 400
        labels:
          severity: info
        annotations:
          summary: 2 hours of continuous activity
          description: No 5 minute idle gap on {{ $labels.host }} for 2 hours. Stand up, drink water.

      - alert: HighMemoryPressure
        expr: molly_memory_pressure_level >= 2
        for: 10m
        labels:
          severity: info
        annotations:
          summary: Memory pressure elevated on {{ $labels.host }}
          description: Pressure level {{ $value }} (2 warn, 4 critical) for 10 minutes.

      - alert: BatteryLow
        expr: molly_battery_percent < 15 and molly_battery_on_ac == 0
        for: 2m
        labels:
          severity: info
        annotations:
          summary: Battery below 15% on {{ $labels.host }}
          description: Battery at {{ $value }}% and not on AC power.

  # Informational anomaly alerts. They never page; Grafana shows them on the
  # Health dashboard and as an "Anomalies today" tile on Overview.
  - name: molly-anomalies
    interval: 60s
    rules:
      # Edit this one number to change what counts as a big Claude day.
      - record: molly:claude_spend_threshold_usd
        expr: vector(50)

      - alert: SwitchRateSpike
        # Twice the 7 day median switch rate while active. The 0.5 floor on the
        # baseline keeps a quiet week from making any activity look like a spike.
        expr: >
          molly:switch_rate:5m > 2 * quantile_over_time(0.5, molly:switch_rate:5m[7d])
          and quantile_over_time(0.5, molly:switch_rate:5m[7d]) > 0.5
          and on (user, host) molly_user_active == 1
        for: 15m
        labels:
          severity: info
        annotations:
          summary: App switching is twice your weekly norm
          description: "{{ $value | printf \"%.1f\" }} switches per minute on {{ $labels.host }} for 15 minutes. Something is pulling you around."

      - alert: NoBreakFourHours
        expr: min_over_time(molly_user_active[4h]) == 1 and count_over_time(molly_user_active[4h]) > 800
        labels:
          severity: info
        annotations:
          summary: 4 hours without a break
          description: No 5 minute idle gap on {{ $labels.host }} for 4 hours.

      - alert: ActiveDayNoCommits
        # A long weekday with nothing committed. hour() is UTC; 22 is 17:00 or 18:00
        # on the US east coast. Adjust for your timezone.
        expr: >
          molly:active_hours:1d > 6
          and on (user, host) sum by (user, host) (increase(molly_git_commits_total{author="me"}[1d])) == 0
          and on () (day_of_week() >= 1 < 6)
          and on () (hour() >= 22 < 24)
        labels:
          severity: info
        annotations:
          summary: 6+ active hours and no commits today
          description: "{{ $value | printf \"%.1f\" }} active hours on {{ $labels.host }} with nothing committed. Meetings, reading, or work outside git?"

      - alert: MemoryPressureCritical
        expr: molly_memory_pressure_level >= 4
        for: 5m
        labels:
          severity: info
        annotations:
          summary: Memory pressure critical on {{ $labels.host }}
          description: macOS is at critical memory pressure for 5 minutes. Expect swapping and stalls.

      - alert: HighClaudeSpend
        expr: sum by (user, host) (increase(molly_claude_estimated_cost_usd_total[1d])) > scalar(molly:claude_spend_threshold_usd)
        labels:
          severity: info
        annotations:
          summary: Estimated Claude spend above threshold today
          description: "About ${{ $value | printf \"%.2f\" }} in the last 24 hours on {{ $labels.host }} (threshold in molly:claude_spend_threshold_usd)."

      - alert: MeetingMarathon
        expr: sum by (user, host) (increase(molly_meeting_seconds_total[1d])) > 4 * 3600
        labels:
          severity: info
        annotations:
          summary: More than 4 hours of meetings today
          description: "Microphone or camera in use for {{ $value | humanizeDuration }} in the last 24 hours."

      - alert: DiskAlmostFull
        expr: >
          molly_disk_free_bytes{mount="/System/Volumes/Data"}
          / molly_disk_total_bytes{mount="/System/Volumes/Data"} < 0.1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: Less than 10% disk free on {{ $labels.host }}
          description: "{{ $value | humanizePercentage }} of the data volume is free."

      - alert: CollectorFailing
        expr: increase(molly_collector_errors_total{collector!="codex"}[30m]) > 5
        labels:
          severity: info
        annotations:
          summary: Collector {{ $labels.collector }} keeps failing
          description: "{{ $value | printf \"%.0f\" }} errors in 30 minutes. Run `molly doctor`; a permission is the usual cause."

      - alert: ScrapeLarge
        expr: scrape_samples_scraped{job="molly"} > 5000
        for: 10m
        labels:
          severity: info
        annotations:
          summary: Molly exposes more than 5000 series
          description: "{{ $value }} samples per scrape. A label policy's maxCardinality is probably too generous; see /privacy."

      - alert: NotStandingEnough
        # Active for 90 minutes while neither stand hours nor steps changed. Needs the
        # phone to have posted in that window, so a phone that is off cannot trigger it.
        expr: >
          (min_over_time(molly_user_active[90m]) == 1 and count_over_time(molly_user_active[90m]) > 300)
          and on (user, host) (changes(molly_health_today{type="stand_hours"}[90m]) == 0)
          and on (user, host) (changes(molly_health_today{type="steps"}[90m]) == 0)
          and on (user, host) (changes(molly_health_last_post_timestamp_seconds[90m]) >= 1)
        labels:
          severity: info
        annotations:
          summary: 90 minutes at the machine without standing up
          description: "No new stand hour or steps on {{ $labels.host }} while active for 90 minutes. Stand up, walk a little."
