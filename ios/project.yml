name: MollyHealth
options:
  bundleIdPrefix: com.aschepis.molly
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: DQR8D2E7KK
    CODE_SIGN_STYLE: Automatic
packages:
  MollyHealthCore:
    path: MollyHealthCore
targets:
  MollyHealth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - MollyHealth
    dependencies:
      - package: MollyHealthCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aschepis.molly.health
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    entitlements:
      path: MollyHealth/MollyHealth.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: MollyHealth/Info.plist
      properties:
        CFBundleDisplayName: Molly Health
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: Molly Health reads your Health data and posts daily totals to your own Mac. Nothing is sent anywhere else.
        NSLocalNetworkUsageDescription: Molly Health posts your daily totals to your Mac on your network.
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.aschepis.molly.health.refresh
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
schemes:
  MollyHealth:
    build:
      targets:
        MollyHealth: all
    run:
      config: Debug
